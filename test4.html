<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test4 · landing-card lab (no loader)</title>
    <link rel="stylesheet" href="assets/tailwind/dist/output.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/landing.css">
    <script src="assets/vendor/anime.min.js"></script>
    <style>
        /* ===== LAB: карточка v2. Ссылок-кнопок внутри блока больше нет — они вынесены под карточку текстом. ===== */
        .lab-card {
            position: relative;
            margin-top: 2rem;
            width: 100%;
            max-width: 26rem;
            padding: 1.4rem 1.4rem 1.25rem;
            border-radius: 1.75rem;
            background: linear-gradient(180deg, rgba(30,41,82,.55), rgba(15,23,42,.72));
            border: 1px solid rgba(148,163,184,.16);
            box-shadow: 0 24px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
            backdrop-filter: blur(16px);
            box-sizing: border-box;
            overflow: hidden;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .lab-card:hover { transform: translateY(-2px); border-color: rgba(129,140,248,.35); box-shadow: 0 28px 70px -20px rgba(0,0,0,.75), 0 0 0 1px rgba(99,102,241,.12), 0 0 44px -12px rgba(99,102,241,.35); }
        .lab-card::before { /* верхняя градиентная нить */
            content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
            background: linear-gradient(90deg, transparent, #6366f1 20%, #a78bfa 50%, #6366f1 80%, transparent);
            opacity: .8;
        }
        .lab-card::after { /* мягкое свечение сверху */
            content: ""; position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
            width: 320px; height: 160px; border-radius: 50%;
            background: radial-gradient(closest-side, rgba(99,102,241,.25), transparent);
            pointer-events: none;
        }
        .lab-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: .6rem; }
        .lab-label { display: inline-flex; align-items: center; gap: .45rem; font-size: .7rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: #8fa0d0; }
        .lab-label .hash { display: inline-flex; align-items: center; justify-content: center; width: 1.35rem; height: 1.35rem; border-radius: .5rem; background: rgba(99,102,241,.16); border: 1px solid rgba(129,140,248,.3); color: #a5b4fc; font-size: .8rem; }
        .lab-count { font-family: ui-monospace, Menlo, monospace; font-size: .72rem; color: #64748b; }
        .lab-count b { color: #a5b4fc; font-weight: 700; }

        .lab-field { position: relative; }
        .lab-input {
            width: 100%; box-sizing: border-box;
            padding: .95rem 5.6rem .95rem 1.1rem;
            border-radius: 1.1rem;
            font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
            font-size: 1.55rem; font-weight: 700; letter-spacing: .04em; text-align: left;
            color: #f1f5f9; background: #0a0f22;
            border: 1px solid rgba(148,163,184,.22);
            outline: none; caret-color: #818cf8;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .lab-input::placeholder { color: #475569; font-weight: 400; }
        .lab-input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.22), 0 0 30px -8px rgba(99,102,241,.5); }
        .lab-input.is-error { border-color: #fb7185; animation: lab-shake .3s ease; }
        @keyframes lab-shake { 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }

        .lab-tools { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); display: flex; gap: .35rem; }
        .lab-tool {
            width: 2.1rem; height: 2.1rem; display: inline-flex; align-items: center; justify-content: center;
            border-radius: .7rem; cursor: pointer; color: #94a3b8;
            background: rgba(30,41,59,.8); border: 1px solid rgba(148,163,184,.18);
            transition: color .15s, border-color .15s, transform .1s, background .15s;
        }
        .lab-tool:hover { border-color: rgba(148,163,184,.4); background: rgba(51,65,85,.9); }
        #lab-clear:hover { color: #fb7185; }
        #lab-dice:hover { color: #818cf8; }
        .lab-tool:active { transform: scale(.9); }

        .lab-chips { display: flex; align-items: center; gap: .4rem; margin-top: .65rem; font-size: .75rem; color: #64748b; }
        .lab-chip {
            padding: .28rem .7rem; border-radius: 9999px; cursor: pointer;
            font-family: ui-monospace, Menlo, monospace; font-size: 1rem; color: #b8c4e0;
            background: rgba(99,102,241,.1); border: 1px solid rgba(129,140,248,.25);
            transition: background .15s, color .15s, transform .1s;
        }
        .lab-chip:hover { background: rgba(99,102,241,.25); color: #fff; }
        .lab-chip:active { transform: scale(.94); }

        .lab-error { margin: .5rem 0 0; font-size: .8rem; color: #fb7185; min-height: 1.2em; }

        .lab-start {
            position: relative; margin-top: .8rem; width: 100%; padding: 1rem; overflow: hidden;
            border: none; border-radius: 1.1rem; cursor: pointer;
            font-size: 1.1rem; font-weight: 800; letter-spacing: .04em; color: #fff;
            background-image: linear-gradient(135deg, #6366f1, #8b5cf6);
            box-shadow: 0 10px 30px -10px rgba(99,102,241,.55);
            transition: transform .1s ease, box-shadow .2s ease, filter .2s ease;
        }
        .lab-start:hover { filter: brightness(1.1); box-shadow: 0 14px 36px -8px rgba(129,140,248,.65); }
        .lab-start:active { transform: scale(.98); }
        .lab-start:disabled { filter: grayscale(.4) brightness(.7); cursor: not-allowed; box-shadow: none; }
        .lab-start::after { /* блик */
            content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
            transform: skewX(-20deg); transition: left .5s ease;
        }
        .lab-start:hover::after { left: 120%; }

        /* ссылки — заметные пилюли под карточкой */
        .lab-links { margin-top: 1.1rem; display: flex; gap: .5rem; justify-content: center; }
        .lab-links a {
            display: inline-flex; align-items: center; gap: .45rem;
            padding: .55rem 1.1rem; border-radius: 9999px;
            font-size: .82rem; font-weight: 600; text-decoration: none; color: #c4d0f0;
            background: rgba(30,41,82,.6); border: 1px solid rgba(129,140,248,.25);
            backdrop-filter: blur(8px);
            transition: background .15s, color .15s, border-color .15s, transform .1s;
        }
        .lab-links a:hover { color: #fff; background: rgba(99,102,241,.25); border-color: rgba(129,140,248,.5); }
        .lab-links a:active { transform: scale(.96); }
        .lab-links a svg { flex-shrink: 0; }
    </style>
</head>
<body class="min-h-screen w-full max-w-[100vw] overflow-x-clip bg-gray-800 text-white">
    <div class="clz-bg" aria-hidden="true"></div>
    <button id="landing-lang" class="landing-lang" type="button" aria-label="Toggle language">EN</button>

    <main class="landing-main">
        <h1 class="landing-title">
            <span class="title-astra gradient-text">ASTRA</span>
            <span class="title-collatz">COLLATZ</span>
        </h1>
        <p class="landing-tagline">Any number. One law. Always one?</p>
        <div class="landing-rules">
            <span class="landing-pill"><span class="pill-num">1.</span><span>Even — divide by 2</span></span>
            <span class="landing-pill"><span class="pill-num">2.</span><span>Odd — multiply by 3 and add 1</span></span>
            <span class="landing-pill"><span class="pill-num">3.</span><span>Repeat until you reach 1</span></span>
        </div>

        <!-- ===== EXPERIMENT: карточка без landing-secondary внутри ===== -->
        <div class="lab-card">
            <div class="lab-top">
                <label class="lab-label" for="lab-input"><span class="hash">#</span>Enter your number</label>
                <span class="lab-count"><b id="lab-len">2</b>/100</span>
            </div>
            <div class="lab-field">
                <input id="lab-input" class="lab-input" type="text" inputmode="numeric" autocomplete="off" value="27" placeholder="number">
                <div class="lab-tools">
                    <button class="lab-tool" id="lab-clear" type="button" title="Clear" aria-label="Clear input">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eraser" viewBox="0 0 16 16">
                            <path d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm2.121.707a1 1 0 0 0-1.414 0L4.16 7.547l5.293 5.293 4.633-4.633a1 1 0 0 0 0-1.414zM8.746 13.547 3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z"/>                        </svg>                   
                    </button>

                    <button class="lab-tool" id="lab-dice" type="button" title="Random" aria-label="Random number">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                            <path d="M12 12h.01"/>
                            <path d="M16 8h.01"/>
                            <path d="M8 16h.01"/>
                            <path d="M16 16h.01"/>
                            <path d="M8 8h.01"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="lab-chips">
                <p>Try these: </p>
                <button class="lab-chip" type="button" data-n="27">27</button>
                <button class="lab-chip" type="button" data-n="97">97</button>
                <button class="lab-chip" type="button" data-n="871">871</button>
                <button class="lab-chip" type="button" data-n="77031">77031</button>
            </div>
            <p id="lab-error" class="lab-error" aria-live="polite"></p>
            <button id="lab-start" class="lab-start" type="button">Start</button>
        </div>
        <div class="lab-links">
            <a href="guide.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>How it works</a>
            <a href="guide.html?tab=about"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>About</a>
        </div>
    </main>

    <script>
        // звёзды (копия buildStars, без модулей)
        (function stars(n = 90) {
            const bg = document.querySelector('.clz-bg');
            const f = document.createDocumentFragment();
            for (let i = 0; i < n; i++) {
                const s = document.createElement('span');
                s.className = 'clz-star';
                const size = Math.random() * 2 + 1;
                s.style.top = Math.random() * 100 + '%';
                s.style.left = Math.random() * 100 + '%';
                s.style.width = s.style.height = size + 'px';
                s.style.setProperty('--delay', Math.random() * 4 + 's');
                s.style.setProperty('--dur', (2.5 + Math.random() * 3) + 's');
                f.appendChild(s);
            }
            bg.appendChild(f);
        })();

        const input = document.getElementById('lab-input');
        const err = document.getElementById('lab-error');
        const btn = document.getElementById('lab-start');
        const len = document.getElementById('lab-len');
        const clean = v => v.replace(/[^\d]/g, '').replace(/^0+(?=\d)/, '').slice(0, 100);
        function paint() {
            len.textContent = input.value.length;
            btn.disabled = input.value.length === 0;
        }
        function setErr(m) { err.textContent = m || ''; input.classList.toggle('is-error', !!m); }
        input.addEventListener('input', () => { const c = clean(input.value); if (c !== input.value) input.value = c; setErr(''); paint(); });
        document.getElementById('lab-clear').onclick = () => { input.value = ''; setErr(''); paint(); input.focus(); };
        document.getElementById('lab-dice').onclick = () => { input.value = String(Math.floor(Math.random() * 100000000) + 1); setErr(''); paint(); };
        document.querySelectorAll('.lab-chip').forEach(c => c.onclick = () => { input.value = c.dataset.n; setErr(''); paint(); });
        function start() {
            if (!input.value) return setErr('The field is empty');
            if (!/^\d+$/.test(input.value) || input.value === '0') return setErr('Enter a positive whole number');
            btn.disabled = true;
            btn.textContent = 'Launching…';
            setTimeout(() => { btn.disabled = false; btn.textContent = 'Start'; paint(); }, 1200);
        }
        btn.onclick = start;
        input.onkeydown = e => { if (e.key === 'Enter') start(); };
        paint();
    </script>
</body>
</html>
