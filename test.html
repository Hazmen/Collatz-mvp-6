<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segmented Controls by Hazmen!!! :D</title>

<!-- || -------- ALL OF THE CSS -------- || -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background-color: #242f47;
    color: #ffffff;
    display: flex;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    gap: 2.5rem;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

#runButton {
    height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    background-image: linear-gradient(to right, #4f46e5, #7c3aed);
    border-radius: 1rem;
    transition: all 150ms;
    box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2), 0 4px 6px -4px rgba(99, 102, 241, 0.2);
    border: none;
    cursor: pointer;

    width: 100px;
}

#runButton:hover {
    background-image: linear-gradient(to right, #6366f1, #8b5cf6);
    box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3), 0 4px 6px -4px rgba(99, 102, 241, 0.3);
}

#runButton:active {
    transform: scale(0.95);
}

.locked {
    opacity: .5;
    pointer-events: none;
}
</style>
</head>
<body>

    <button title="Run (Space)" id="runButton" class="proc-run lockable">
        <img src="/assets/media/svgs/ring-resize.svg" alt="Анимированная иконка" width="32" height="32">
    </button>

<!-- || -------- ALL OF THE LOGIC -------- || -->
<script>
const btn = document.querySelector('.proc-run');
btn.addEventListener('click', ()=> {console.log('Hello')});
btn.setAttribute('aria-busy', 'true');
btn.classList.add('locked')
</script>

</body>
</html>
