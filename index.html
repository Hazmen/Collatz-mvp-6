<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Collatzium — interactive Collatz conjecture explorer">
    <meta name="theme-color" content="#0b1020">
    <title>Collatzium</title>

    <!-- cross-document View Transitions (progressive enhancement) -->
    <style>@view-transition { navigation: auto; }</style>

    <!-- LINKS -->
    <link rel="stylesheet" href="assets/tailwind/dist/output.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/landing.css">
    <script src="assets/vendor/anime.min.js"></script>
</head>
<body class="min-h-screen w-full max-w-[100vw] overflow-x-clip bg-gray-800 text-white">

    <!-- LOADING SCREEN (shared overlay) -->
    <div id="loader-overlay" class="loader-overlay" role="status" aria-live="polite">
        <div class="loader-spinner" aria-hidden="true">
            <span class="loader-ring loader-ring-outer"></span>
            <span class="loader-ring loader-ring-inner"></span>
        </div>
        <div class="loader-title gradient-text">COLLATZIUM</div>
        <p class="loader-quote" data-loader-quote></p>
    </div>

    <!-- animated backdrop -->
    <div class="clz-bg" aria-hidden="true"></div>

    <!-- language toggle -->
    <button id="landing-lang" class="landing-lang" type="button" aria-label="Toggle language">RU</button>

    <main class="landing-main">
        <h1 class="landing-title reveal">
            <span class="title-astra gradient-text">COLLA</span>
            <span class="title-collatz">TZIUM</span>
        </h1>

        <p class="landing-tagline reveal" data-i18n="home.tagline">Любое число. Один закон. Всегда единица?</p>

        <div class="landing-rules reveal">
            <span class="landing-pill"><span class="pill-num">1.</span><span data-i18n="home.rule1">Чётное — делим на 2</span></span>
            <span class="landing-pill"><span class="pill-num">2.</span><span data-i18n="home.rule2">Нечётное — умножаем на 3 и прибавляем 1</span></span>
            <span class="landing-pill"><span class="pill-num">3.</span><span data-i18n="home.rule3">Повторяем, пока не дойдём до 1</span></span>
        </div>

        <div class="landing-card reveal">
            <label class="landing-card-label" for="landing-input" data-i18n="home.enterNumber">Введите число</label>
            <input
                id="landing-input"
                class="landing-input"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                autofocus
                value="27"
                data-i18n="home.placeholder"
                data-i18n-attr="placeholder"
                placeholder="число"
            >
            <p id="landing-error" class="landing-error" aria-live="polite"></p>

            <button id="landing-start" class="landing-start" type="button" data-i18n="home.start">Запустить</button>

            <div class="landing-secondary">
                <a href="guide.html" data-i18n="home.howItWorks">Как это работает</a>
                <a href="guide.html?tab=about" data-i18n="home.about">О проекте</a>
            </div>
        </div>
    </main>

    <script src="./ESmodules/shared/i18n.js" type="module"></script>
    <script src="./ESmodules/shared/loader.js" type="module"></script>
    <script src="./ESmodules/landing/landing-main.js" type="module"></script>
</body>
</html>
